services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kanna_root
      MYSQL_DATABASE: kanna
      MYSQL_USER: kanna
      MYSQL_PASSWORD: kanna_secret
    ports:
      - "3306:3306"
    volumes:
      - kanna_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ukanna", "-pkanna_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Optional local object storage for dev (production: use Huawei Cloud OBS or other S3-compatible service).
  # Start with: docker compose -f docker-compose.multiuser.yml --profile local-dev up -d
  minio:
    profiles: ["local-dev"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kanna
      MINIO_ROOT_PASSWORD: kanna_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kanna_minio_data:/data

  minio-init:
    profiles: ["local-dev"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo "waiting for minio..."
          sleep 2
        done
        mc mb --ignore-existing local/kanna
    environment:
      MINIO_ROOT_USER: kanna
      MINIO_ROOT_PASSWORD: kanna_secret
    restart: "no"

  # Optional: Kanna app container (requires Claude/Codex on host or in image, plus project mounts).
  # Pull: docker pull hilpdocker/kanna:latest
  # Start: docker compose -f docker-compose.multiuser.yml --profile app up -d
  kanna:
    profiles: ["app"]
    image: ${KANNA_IMAGE:-hilpdocker/kanna:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3210:3210"
    environment:
      KANNA_RUNTIME_PROFILE: prod
      KANNA_AUTH_MODE: multiuser
      KANNA_STORAGE: mysql
      DATABASE_URL: mysql://kanna:kanna_secret@mysql:3306/kanna
      REDIS_URL: redis://redis:6379
      KANNA_S3_ENDPOINT: ${KANNA_S3_ENDPOINT:-}
      KANNA_S3_REGION: ${KANNA_S3_REGION:-cn-north-4}
      KANNA_S3_BUCKET: ${KANNA_S3_BUCKET:-}
      KANNA_S3_ACCESS_KEY_ID: ${KANNA_S3_ACCESS_KEY_ID:-}
      KANNA_S3_SECRET_ACCESS_KEY: ${KANNA_S3_SECRET_ACCESS_KEY:-}
      KANNA_S3_FORCE_PATH_STYLE: ${KANNA_S3_FORCE_PATH_STYLE:-}
      KANNA_SECRETS_KEY: dev-kanna-secrets-key-32bytes!!
      KANNA_DISABLE_SELF_UPDATE: "1"
      KANNA_TRUST_PROXY: "0"
    volumes:
      - kanna_data:/root/.kanna
      # Replace with your host projects directory for agent cwd access:
      - ${KANNA_PROJECTS_DIR:-./projects}:/projects
    command: ["--host", "0.0.0.0", "--port", "3210", "--no-open", "--strict-port"]

volumes:
  kanna_mysql_data:
  kanna_minio_data:
  kanna_data:
